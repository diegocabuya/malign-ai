services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: malign_local
      POSTGRES_PASSWORD: malign_local_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malign_local -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - malign-postgres-18-data:/var/lib/postgresql

volumes:
  malign-postgres-18-data:
