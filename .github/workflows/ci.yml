name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: malign_ci
          POSTGRES_PASSWORD: malign_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U malign_ci -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MALIGN_TEST_DATABASE_URL: postgresql://malign_ci:malign_ci_only@127.0.0.1:5432/postgres
      MALIGN_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm test:m2a
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
